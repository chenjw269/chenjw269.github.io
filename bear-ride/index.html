<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e6eee3"><meta name="description" content="小熊骑行小游戏：跳过石头和沟壑，收集小花，也可以自由观景。"><title>小熊骑行 · Bear Ride</title><link rel="stylesheet" href="style.css?v=2"></head>
<body><main id="game" aria-label="小熊骑行游戏画面"></main>
<div id="loading">正在加载游戏…</div>
<header id="hud" hidden><div class="hud-left"><span id="route-name"></span><strong id="distance">0 m</strong><span id="flowers">✿ 0</span></div><button id="pause" aria-label="暂停游戏">Ⅱ</button><div class="progress"><i id="progress"></i></div><div id="effects" aria-live="polite"></div><div class="play-legend"><span class="collect-key">✿ 金框：收集</span><span class="avoid-key">▲ 红框：跳过</span></div></header>
<section id="panel" class="overlay"><div class="sheet"><div class="eyebrow">骑行小游戏</div><h1>小熊骑行<span>跳过障碍，收集小花</span></h1><p class="intro">空格或点击跳跃。如果只想体验旅途风景，选「自在观景」。</p><div class="modes" role="group" aria-label="游戏模式"><button data-mode="run" class="active">沿途冒险<small>跳过障碍 · 收集小花</small></button><button data-mode="scenic">自在观景<small>无障碍 · 自由选景</small></button></div><div class="section-label">选择关卡 <span id="wallet"></span></div><div id="routes" class="routes"></div><div class="section-label">选择角色</div><div id="characters" class="characters"></div><button id="start" class="primary">开始骑行 <span>↗</span></button><p class="help">空格 / ↑ / 点击画面跳跃 · P 暂停<br>道具：护盾挡一次碰撞 · 磁铁吸花 · 顺风加速<br>进度保存在当前浏览器，观景也能收集小花。</p><a class="home-link" href="/">← 返回主页</a></div></section>
<section id="dialog" class="overlay" hidden><div class="modal"><div class="eyebrow" id="dialog-tag"></div><h2 id="dialog-title"></h2><p id="dialog-copy"></p><button id="continue" class="primary"></button><button id="back" class="secondary">返回选关</button></div></section>
<button id="jump" hidden aria-label="跳跃">↑<small>跳一下</small></button><div id="toast" role="status"></div>
<script src="vendor/phaser.min.js"></script><script type="module" src="game.js?v=3"></script>
</body></html>
